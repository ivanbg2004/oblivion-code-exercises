<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(255, 200, 10);
        }

        h1 {
            text-align: right;
            background-color: lime;
            color: white;
            margin-bottom: 99px;
        }

        h2 {
            text-align: center;
            background-color: cadetblue;
            color: white;
            margin-bottom: 99px;
        }

        b,i,u {
            background-color: black;
            color: white;
        }

        .clase1 {
            font-size: 20px;
        }

        #elem1 {
            font-size: 30px;
        }

        #elem2 {
            font-size: 40px;
        }

        #elem3 {
            font-size: 50px;
        }
    </style>
</head>

<body>
    <h1>Encabezado h1</h1>
    <h2>Encabezado h2</h2>
    <h2>Otro encabezado h2</h2>
    <p class="clase1">La palabra en <b>negrita</b></p>
    <p>La palabra en <i>cursiva</i></p>
    <p>La palabra <u>subrayada</u></p>
    <p>Lenguajes</p>
    <ol class="clase1" type="A">
        <li id="elem1">HTML</li>
        <li id="elem2">CSS</li>
        <li id="elem3">Javascript</li>
    </ol>
</body>

</html>
